n="round"/><rect x="490" y="162" width="130" height="54" rx="7" fill="#fff2cf" stroke="#c48a1d" stroke-width="1.4"/><text x="555" y="184.7" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2430" font-weight="400"><tspan x="555" dy="0">s<tspan baseline-shift="sub" font-size="72%">4</tspan> write refund.py</tspan></text><text x="555" y="204.5" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#5b6270" font-weight="400"><tspan x="555" dy="0">hash before/after · cost</tspan></text><polyline points="620,189 639,189" fill="none" stroke="#3a4150" stroke-width="1.4" marker-end="url(#head)" stroke-linejoin="round"/><rect x="640" y="162" width="130" height="54" rx="7" fill="#fff2cf" stroke="#c48a1d" stroke-width="1.4"/><text x="705" y="184.7" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2430" font-weight="400"><tspan x="705" dy="0">s<tspan baseline-shift="sub" font-size="72%">5</tspan> run tests</tspan></text><text x="705" y="204.5" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#5b6270" font-weight="400"><tspan x="705" dy="0"><tspan font-weight="700">exit 0</tspan> · cost</tspan></text><polyline points="770,189 789,189" fill="none" stroke="#3a4150" stroke-width="1.4" marker-end="url(#head)" stroke-linejoin="round"/><rect x="790" y="162" width="130" height="54" rx="7" fill="#fff2cf" stroke="#c48a1d" stroke-width="1.4"/><text x="855" y="184.7" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2430" font-weight="400"><tspan x="855" dy="0">s<tspan baseline-shift="sub" font-size="72%">6</tspan> diff digest</tspan></text><text x="855" y="204.5" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#5b6270" font-weight="400"><tspan x="855" dy="0">paths ⊆ payments/</tspan></text><text x="130" y="233.3" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9.5" fill="#3b8a5a" font-weight="400" font-style="italic"><tspan x="130" dy="0">all six steps = the full trajectory (Level 2)</tspan></text><text x="590" y="233.3" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9.5" fill="#c48a1d" font-weight="400" font-style="italic"><tspan x="590" dy="0">amber = outcome-bearing</tspan></text><rect x="40.0" y="279.0" width="140" height="70" rx="8" fill="#e6eefc" stroke="#4a74c9" stroke-width="1.2"/><text x="110" y="298.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2430" font-weight="400"><tspan x="110" dy="0"><tspan font-weight="700">Meter</tspan></tspan><tspan x="110" dy="13.0">tokens by model · tool</tspan><tspan x="110" dy="13.0">calls · wall-clock · gas;</tspan><tspan x="110" dy="13.0">reconcilable per step</tspan></text><rect x="195.0" y="279.0" width="130" height="70" rx="8" fill="#e6eefc" stroke="#4a74c9" stroke-width="1.2"/><text x="260" y="304.5" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2430" font-weight="400"><tspan x="260" dy="0"><tspan font-weight="700">root</tspan></tspan><tspan x="260" dy="13.0">MerkleRoot(s<tspan baseline-shift="sub" font-size="72%">1</tspan>…s<tspan baseline-shift="sub" font-size="72%">6</tspan>)</tspan><tspan x="260" dy="13.0">terminal hash h<tspan baseline-shift="sub" font-size="72%">n</tspan></tspan></text><rect x="345.0" y="269.0" width="270" height="90" rx="8" fill="#fff2cf" stroke="#c48a1d" stroke-width="1.2"/><text x="480" y="297.2" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2430" font-weight="400"><tspan x="480" dy="0"><tspan font-weight="700">Evidence set</tspan> (outcome-bearing subset)</tspan><tspan x="480" dy="13.65">s<tspan baseline-shift="sub" font-size="72%">4</tspan> before/after hashes</tspan><tspan x="480" dy="13.65">s<tspan baseline-shift="sub" font-size="72%">5</tspan> exit 0 · s<tspan baseline-shift="sub" font-size="72%">6</tspan> diff digest</tspan><tspan x="480" dy="13.65">three facts establish Φ</tspan></text><polyline points="705,216 705,314 615,314" fill="none" stroke="#c48a1d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#head)" stroke-linejoin="round"/><text x="713" y="267.3" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9.5" fill="#c48a1d" font-weight="400" font-style="italic"><tspan x="713" dy="0">marked as</tspan><tspan x="713" dy="12">outcome-bearing</tspan></text><rect x="30" y="430" width="270" height="100" rx="9" fill="#e6eefc" stroke="#4a74c9" stroke-width="1.4"/><text x="165" y="460.4" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2430" font-weight="400"><tspan x="165" dy="0"><tspan font-weight="700">Level 0 — settlement</tspan></tspan><tspan x="165" dy="15.5">on-chain: root, h<tspan baseline-shift="sub" font-size="72%">n</tspan>, attestation, pointer</tspan><tspan x="165" dy="15.5">plus meter totals and the verdict on Φ</tspan><tspan x="165" dy="15.5">what the reputation engine consumes</tspan></text><rect x="345" y="430" width="270" height="100" rx="9" fill="#fff2cf" stroke="#c48a1d" stroke-width="1.4"/><text x="480" y="460.4" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2430" font-weight="400"><tspan x="480" dy="0"><tspan font-weight="700">Level 1 — audit</tspan> (probability p)</tspan><tspan x="480" dy="15.5">evidence set plus Merkle paths to the root</tspan><tspan x="480" dy="15.5">c<tspan baseline-shift="sub" font-size="72%">audit</tspan> grows with evidence volume,</tspan><tspan x="480" dy="15.5">not with trajectory length</tspan></text><rect x="660" y="430" width="270" height="100" rx="9" fill="#e4f3e9" stroke="#3b8a5a" stroke-width="1.4"/><text x="795" y="460.4" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2430" font-weight="400"><tspan x="795" dy="0"><tspan font-weight="700">Level 2 — challenge</tspan> (bonded)</tspan><tspan x="795" dy="15.5">full trajectory; any step verifiable</tspan><tspan x="795" dy="15.5">against the same root</tspan><tspan x="795" dy="15.5">history cannot be revised after commitment</tspan></text><polyline points="110,349 110,430" fill="none" stroke="#4a74c9" stroke-width="1.4" marker-end="url(#head)" stroke-linejoin="round"/><polyline points="260,349 260,430" fill="none" stroke="#4a74c9" stroke-width="1.4" marker-end="url(#head)" stroke-linejoin="round"/><polyline points="480,359 480,430" fill="none" stroke="#c48a1d" stroke-width="1.4" marker-end="url(#head)" stroke-linejoin="round"/><polyline points="860,238 860,430" fill="none" stroke="#3b8a5a" stroke-width="1.4" marker-end="url(#head)" stroke-linejoin="round"/><polyline points="165,530 165,556 450,556 450,532" fill="none" stroke="#3a4150" stroke-width="1.4" marker-end="url(#head)" stroke-linejoin="round"/><text x="307" y="575.5" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#5b6270" font-weight="400" font-style="italic"><tspan x="307" dy="0">audit drawn</tspan></text><polyline points="510,530 510,556 795,556 795,532" fill="none" stroke="#3a4150" stroke-width="1.4" marker-end="url(#head)" stroke-linejoin="round"/><text x="652" y="575.5" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#5b6270" font-weight="400" font-style="italic"><tspan x="652" dy="0">disputed</tspan></text><text x="480" y="621.5" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#5b6270" font-weight="400" font-style="italic"><tspan x="480" dy="0">Illustrative: the running example of §2.2. Nothing in this figure is measured.</tspan></text></svg>
