<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640"><defs><marker id="head" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L9,4.5 L0,8.5 z" fill="#3a4150"/></marker></defs><rect width="960" height="640" fill="#ffffff"/><rect x="20" y="14" width="920" height="352" rx="12" fill="#fbfbfc" stroke="#b4bac6" stroke-width="1.2"/><text x="480" y="40.5" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2430" font-weight="400"><tspan x="480" dy="0"><tspan font-weight="700">Verifiable Execution Receipt</tspan>  (running example, §2.2)</tspan></text><rect x="40" y="54" width="880" height="66" rx="8" fill="#ffffff" stroke="#3b8a5a" stroke-width="1.4"/><text x="480" y="78.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2430" font-weight="400"><tspan x="480" dy="0"><tspan font-weight="700">Header</tspan></tspan></text><text x="480" y="94.7" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2430" font-weight="400"><tspan x="480" dy="0">task id · requester · agent · Φ as submitted · budget · runtime image measurement · time range</tspan><tspan x="480" dy="14"><tspan font-weight="700">TEE attestation quote</tspan> over (image, root)</tspan></text><rect x="30" y="130" width="900" height="108" rx="10" fill="none" stroke="#3b8a5a" stroke-width="1.4" stroke-dasharray="6 4"/><text x="480" y="150.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2430" font-weight="400"><tspan x="480" dy="0"><tspan font-weight="700">Hash-chained step sequence</tspan>    h<tspan baseline-shift="sub" font-size="72%">i</tspan> = H( h<tspan baseline-shift="sub" font-size="72%">i−1</tspan> ‖ s<tspan baseline-shift="sub" font-size="72%">i</tspan> )</tspan></text><rect x="40" y="162" width="130" height="54" rx="7" fill="#ffff