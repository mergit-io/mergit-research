<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1012" viewBox="0 0 1000 1012"><defs><marker id="head" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L9,4.5 L0,8.5 z" fill="#3a4150"/></marker></defs><rect width="1000" height="1012" fill="#ffffff"/><rect x="13" y="10" width="134" height="992" rx="10" fill="#f6f7f9" stroke="#b4bac6" stroke-width="1.0" stroke-dasharray="3 3"/><text x="80.0" y="34.4" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2430" font-weight="400"><tspan x="80.0" dy="0"><tspan font-weight="700">Requester</tspan></tspan></text><rect x="153" y="10" width="134" height="992" rx="10" fill="#f6f7f9" stroke="#b4bac6" stroke-width="1.0" stroke-dasharray="3 3"/><text x="220.0" y="34.4" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2430" font-weight="400"><tspan x="220.0" dy="0"><tspan font-weight="700">Orchestrator</tspan></tspan></text><text x="220.0" y="57.2" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#5b6270" font-weight="400" font-style="italic"><tspan x="220.0" dy="0">policy over posteriors;</tspan><tspan x="220.0" dy="12.5">asserts nothing</tspan></text><rect x="293" y="10" width="134" height="992" rx="10" fill="#e6eefc" stroke="#4a74c9" stroke-width="1.0"/><text x="360.0" y="34.4" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2430" font-weight="400"><tspan x="360.0" dy="0"><tspan font-weight="700">Ethereum L2</tspan></tspan></text><text x="360.0" y="57.2" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#5b6270" font-weight="400" font-style="italic"><tspan x="360.0" dy="0">holds commitments</tspan><tspan x="360.0" dy="12.5">and value only</tspan></text><rect x="433" y="10" width="134" height="992" rx="10" fill="#e4f3e9" stroke="#3b8a5a" stroke-width="1.6"/><text x="500.0" y="34.4" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2430" font-weight="400"><tspan x="500.0" dy="0"><tspan font-weight="700">Attested runtime</tspan></tspan></text><text x="500.0" y="58.8" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#5b6270" font-weight="400" font-style="italic"><tspan x="500.0" dy="0">(TEE)</tspan><tspan x="500.0" dy="12.5"><tspan font-weight="700">the only party that</tspan></tspan><tspan x="500.0" dy="12.5"><tspan font-weight="700">may assert what</tspan></tspan><tspan x="500.0" dy="12.5"><tspan font-weight="700">executed</tspan></tspan></text><rect x="573" y="10" width="134" height="992" rx="10" fill="#f6f7f9" stroke="#b4bac6" stroke-width="1.0" stroke-dasharray="3 3"/><text x="640.0" y="34.4" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2430" font-weight="400"><tspan x="640.0" dy="0"><tspan font-weight="700">Validation layer</tspan></tspan></text><text x="640.0" y="56.5" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#5b6270" font-weight="400" font-style="italic"><tspan x="640.0" dy="0">permissioned at v1</tspan></text><rect x="713" y="10" width="134" height="992" rx="10" fill="#f6f7f9" stroke="#b4bac6" stroke-width="1.0" stroke-dasharray="3 3"/><text x="780.0" y="34.4" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2430" font-weight="400"><tspan x="780.0" dy="0"><tspan font-weight="700">Any bonded party</tspan></tspan></text><text x="780.0" y="57.2" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#5b6270" font-weight="400" font-style="italic"><tspan x="780.0" dy="0">permissionless</tspan><tspan x="780.0" dy="12.5">challenge</tspan></text><rect x="853" y="10" width="134" height="992" rx="10" fill="#f0e9fb" stroke="#7b5cc7" stroke-width="1.0"/><text x="920.0" y="34.4" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2430" font-weight="400"><tspan x="920.0" dy="0"><tspan font-weight="700">Reputation engine</tspan></tspan></text><text x="920.0" y="56.5" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#5b6270" font-weight="400" font-style="italic"><tspan x="920.0" dy="0">derives only</tspan></text><polyline points="80.0,150 218.0,150" fill="none" stroke="#3a4150" stroke-width="1.4" marker-end="url(#head)" stroke-linejoin="round"/><rect fill-opacity="0.82" x="91.75" y="119.5" width="114.5" height="28" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/><text x="149.0" y="130.7" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2430" font-weight="400"><tspan x="149.0" dy="0"><tspan font-weight="700">1</tspan> Specify task</tspan><tspan x="149.0" dy="13">Φ, budget, category</tspan></text><rect x="154.0" y="179.0" width="132" height="66" rx="8" fill="#ffffff" stroke="#8a93a3" stroke-width="1.2"/><text x="220.0" y="196.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2430" font-weight="400"><tspan x="220.0" dy="0"><tspan font-weight="700">2</tspan> Route</tspan><tspan x="220.0" dy="13.0">Thompson sampling on</tspan><tspan x="220.0" dy="13.0">value density (human-</tspan><tspan x="220.0" dy="13.0">in-the-loop by default)</tspan></text><polyline points="220.0,274 358.0,274" fill="none" stroke="#3a4150" stroke-width="1.4" marker-end="url(#head)" stroke-linejoin="round"/><rect fill-opacity="0.82" x="240.0" y="243.5" width="98.0" height="28" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/><text x="289.0" y="254.7" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2430" font-weight="400"><tspan x="289.0" dy="0"><tspan font-weight="700">3</tspan> Escrow V</tspan><tspan x="289.0" dy="13">encumber stake S</tspan></text><polyline points="360.0,336 435.0,336" fill="none" stroke="#3a4150" stroke-width="1.4" marker-end="url(#head)" stroke-linejoin="round"/><rect x="434.0" y="309.5" width="132" height="53" rx="8" fill="#e4f3e9" stroke="#3b8a5a" stroke-width="1.2"/><text x="500.0" y="326.5" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2430" font-weight="400"><tspan x="500.0" dy="0"><tspan font-weight="700">4</tspan> Execute</tspan><tspan x="500.0" dy="13.0">meter tokens and gas,</tspan><tspan x="500.0" dy="13.0">hash-chain every step</tspan></text><rect x="434.0" y="378.0" width="132" height="40" rx="8" fill="#e4f3e9" stroke="#3b8a5a" stroke-width="1.2"/><text x="500.0" y="395.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2430" font-weight="400"><tspan x="500.0" dy="0"><tspan font-weight="700">5</tspan> Emit Verifiable</tspan><tspan x="500.0" dy="13.0">Execution Receipt</tspan></text><polyline points="490.0,460 362.0,460" fill="none" stroke="#3a4150" stroke-width="1.4" marker-end="url(#head)" stroke-linejoin="round"/><rect fill-opacity="0.82" x="363.25" y="416.5" width="125.5" height="41" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/><text x="426.0" y="427.7" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2430" font-weight="400"><tspan x="426.0" dy="0"><tspan font-weight="700">5</tspan> Commit Merkle root,</tspan><tspan x="426.0" dy="13">terminal hash,</tspan><tspan x="426.0" dy="13">attestation quote</tspan></text><polyline points="510.0,460 638.0,460" fill="none" stroke="#3a4150" stroke-width="1.4" marker-end="url(#head)" stroke-linejoin="round"/><rect fill-opacity="0.82" x="514.0" y="429.5" width="120.0" height="28" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/><text x="574.0" y="440.7" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2430" font-weight="400"><tspan x="574.0" dy="0">receipt body:</tspan><tspan x="574.0" dy="13">off-chain, encrypted</tspan></text><rect x="574.0" y="495.5" width="132" height="53" rx="8" fill="#ffffff" stroke="#8a93a3" stroke-width="1.2"/><text x="640.0" y="512.5" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2430" font-weight="400"><tspan x="640.0" dy="0"><tspan font-weight="700">6</tspan> Audit, prob. p(a,k)</tspan><tspan x="640.0" dy="13.0">attestation, commitment,</tspan><tspan x="640.0" dy="13.0">evidence ⊨ Φ ?</tspan></text><polyline points="640.0,584 362.0,584" fill="none" stroke="#3a4150" stroke-width="1.4" marker-end="url(#head)" stroke-linejoin="round"/><rect fill-opacity="0.82" x="419.0" y="540.5" width="164.0" height="41" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/><text x="501.0" y="551.7" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2430" font-weight="400"><tspan x="501.0" dy="0"><tspan font-weight="700">7</tspan> Settle. Pass or no draw:</tspan><tspan x="501.0" dy="13">release escrow. Fail: return</tspan><tspan x="501.0" dy="13">escrow, slash on failure</tspan></text><polyline points="360.0,646 82.0,646" fill="none" stroke="#3a4150" stroke-width="1.4" marker-end="url(#head)" stroke-linejoin="round"/><rect fill-opacity="0.82" x="136.25" y="615.5" width="169.5" height="28" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/><text x="221.0" y="626.7" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2430" font-weight="400"><tspan x="221.0" dy="0"><tspan font-weight="700">7/8</tspan> Receive result;</tspan><tspan x="221.0" dy="13">may challenge within window W</tspan></text><polyline points="80.0,708 778.0,708" fill="none" stroke="#3a4150" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#head)" stroke-linejoin="round"/><rect fill-opacity="0.82" x="396.5" y="690.5" width="65.0" height="15" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/><text x="429.0" y="701.7" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2430" font-weight="400"><tspan x="429.0" dy="0"><tspan font-weight="700">8</tspan> within W</tspan></text><polyline points="780.0,770 362.0,770" fill="none" stroke="#3a4150" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#head)" stroke-linejoin="round"/><rect fill-opacity="0.82" x="478.0" y="739.5" width="186.0" height="28" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/><text x="571.0" y="750.7" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2430" font-weight="400"><tspan x="571.0" dy="0"><tspan font-weight="700">8</tspan> Challenge → Level 2 disclosure</tspan><tspan x="571.0" dy="13">→ adjudication → clawback</tspan></text><polyline points="640.0,832 918.0,832" fill="none" stroke="#3a4150" stroke-width="1.4" marker-end="url(#head)" stroke-linejoin="round"/><rect fill-opacity="0.82" x="721.75" y="801.5" width="114.5" height="28" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/><text x="779.0" y="812.7" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2430" font-weight="400"><tspan x="779.0" dy="0"><tspan font-weight="700">9</tspan> validated outcome</tspan><tspan x="779.0" dy="13">+ metered cost</tspan></text><polyline points="780.0,894 918.0,894" fill="none" stroke="#3a4150" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#head)" stroke-linejoin="round"/><rect fill-opacity="0.82" x="789.0" y="863.5" width="120.0" height="28" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/><text x="849.0" y="874.7" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2430" font-weight="400"><tspan x="849.0" dy="0">proven falsification</tspan><tspan x="849.0" dy="13">→ probation</tspan></text><polyline points="920.0,942 222.0,942" fill="none" stroke="#3a4150" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#head)" stroke-linejoin="round"/><rect fill-opacity="0.82" x="417.5" y="911.5" width="307.0" height="28" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/><text x="571.0" y="922.7" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2430" font-weight="400"><tspan x="571.0" dy="0">Update Beta(α,β) and Gamma(κ,τ) per (agent, category);</tspan><tspan x="571.0" dy="13">posteriors feed routing</tspan></text><polyline points="920.0,980 642.0,980" fill="none" stroke="#3a4150" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#head)" stroke-linejoin="round"/><text x="780.0" y="972.7" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2430" font-weight="400"><tspan x="780.0" dy="0">θ<tspan baseline-shift="sub" font-size="72%">LCB</tspan> sets p</tspan></text></svg>
